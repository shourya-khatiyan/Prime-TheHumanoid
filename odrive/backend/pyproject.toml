[project]
name = "odrive-terminal"
version = "0.1.0"
description = "Backend for the VAYN ODrive v3.6 terminal GUI: owns the USB device, enforces safety limits and streams telemetry."
requires-python = ">=3.11,<3.12"
dependencies = [
    "odrive==0.5.1.post0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "msgpack>=1.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pyarrow>=16",
    "python-can>=4.4",
    "pyserial>=3.5",
    "libusb-package>=1.0.30.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "pyinstaller>=6.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
